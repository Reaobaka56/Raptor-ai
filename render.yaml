services:
  - type: redis
    name: raptor-redis
    ipAllowList: []
    plan: free

  - type: web
    name: raptor-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m scripts.run_migrations
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: raptor-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
