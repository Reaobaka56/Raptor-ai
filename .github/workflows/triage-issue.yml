name: Triage Issue

# Auto-triages new GitHub issues with Claude Code — labels/context so a solo founder isn't
# the bottleneck on "let me look into it" for every incoming bug report.

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage"
        required: true
        type: number

jobs:
  triage:
    name: Triage Issue
    # Auto-runs on new issues; re-run by applying the `triage` label or via manual dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.label.name == 'triage'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: triage-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
      cancel-in-progress: true
    permissions:
      # contents: read is what actions/checkout needs; every scope left out of this block
      # is set to none — the agent step below gets no write access of any kind.
      contents: read
      issues: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Set issue number
        run: |
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            echo "ISSUE_NUMBER=${{ github.event.inputs.issue_number }}" >> $GITHUB_ENV
          else
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
          fi

      - name: Fetch issue content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,labels > "$RUNNER_TEMP/issue.json"

      - name: Analyze issue with Claude Code
        # SECURITY: the issue body is untrusted input (anyone can open an issue). This step
        # gets read-only repo tools, no shell, and no GitHub token — it cannot act on the repo,
        # only read it and produce text. Its output is posted by the next step, not by this one.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/prompts/triage-issue.md)

          The issue JSON file is at: ${RUNNER_TEMP}/issue.json" \
            --model sonnet \
            --tools "Read,Glob,Grep" \
            --allowedTools "Read" "Glob" "Grep" \
            --strict-mcp-config \
            > "$RUNNER_TEMP/triage-comment.md"

      - name: Post triage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_FILE="$RUNNER_TEMP/triage-comment.md"
          if [ ! -s "$COMMENT_FILE" ] || [ "$(head -n1 "$COMMENT_FILE")" = "NO_COMMENT" ]; then
            echo "No comment to post"
            exit 0
          fi
          # Guard against the agent accidentally echoing back something that looks like a
          # live API key (e.g. if a malicious issue body tried to trick it into doing so).
          if grep -qE "sk-ant-|github_pat_|ghp_" "$COMMENT_FILE"; then
            echo "Comment contains a credential-like string; refusing to post"
            exit 1
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$COMMENT_FILE"
